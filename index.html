<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>太空戰機</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, "PingFang HK", "Microsoft JhengHei", sans-serif;
    background: #0b1026; color: #e8eaf6; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; padding: 18px 14px 30px;
  }
  .wrap { width: min(94vw, 420px); }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
  h1 { margin: 0; font-size: 34px; line-height: 1.1; }
  .tagline { margin: 4px 0 0; font-size: 13px; color: #9aa3c7; }
  .hud { display: flex; gap: 8px; margin: 12px 0; }
  .hud-box {
    flex: 1; background: #1a2142; border-radius: 8px; padding: 7px 10px; text-align: center;
  }
  .hud-box .label { font-size: 11px; color: #9aa3c7; }
  .hud-box .value { font-size: 19px; font-weight: 700; line-height: 1.25; }
  .controls { display: flex; gap: 8px; margin-bottom: 10px; }
  .controls button {
    flex: 1; font: inherit; cursor: pointer; border: 0; border-radius: 8px;
    background: #2b3a7a; color: #fff; padding: 10px 0; font-weight: 700;
  }
  .controls button:active { opacity: .8; }
  #stage { position: relative; width: 100%; }
  canvas {
    display: block; width: 100%; height: auto; aspect-ratio: 420 / 640;
    border-radius: 10px; background: #0b1026; touch-action: none;
  }
  #overlay {
    position: absolute; inset: 0; z-index: 5; border-radius: 10px;
    background: rgba(5, 8, 24, .78);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-align: center; padding: 24px;
  }
  #overlay.show { display: flex; }
  #overlay .big { font-size: 32px; font-weight: 800; margin: 0; }
  #overlay .sub { font-size: 14px; line-height: 1.7; color: #c5cae9; margin: 0; white-space: pre-line; }
  #overlay button {
    font: inherit; cursor: pointer; border: 0; border-radius: 8px;
    background: #ffca28; color: #3e2700; padding: 12px 26px; font-weight: 800; font-size: 17px;
  }
  .howto { margin-top: 12px; font-size: 13px; line-height: 1.7; color: #9aa3c7; }
  .note { margin-top: 6px; font-size: 12px; color: #6b7396; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>太空戰機</h1>
      <p class="tagline">手指拖動，自動開火，唔好撞到敵機！</p>
    </div>
  </header>
  <div class="hud">
    <div class="hud-box"><div class="label">分數</div><div class="value" id="score">0</div></div>
    <div class="hud-box"><div class="label">最高分</div><div class="value" id="best">0</div></div>
    <div class="hud-box"><div class="label">生命</div><div class="value" id="lives">❤️❤️❤️</div></div>
  </div>
  <div class="controls">
    <button id="pause-btn" type="button">暫停</button>
    <button id="restart-btn" type="button">重新開始</button>
  </div>
  <div id="stage">
    <canvas id="game" width="420" height="640" aria-label="太空戰機遊戲畫面"></canvas>
    <div id="overlay">
      <p class="big" id="overlay-title"></p>
      <p class="sub" id="overlay-sub"></p>
      <div id="overlay-buttons"></div>
    </div>
  </div>
  <p class="howto">玩法：用手指按住戰機拖動，子彈會自動發射。打爆敵機攞分，⭐ 升級火力，🛡️ 得到護盾，❤️ 補返一條命。敵機愈嚟愈快，仲有大佬出現，小心！</p>
  <p class="note">最高分只會儲存喺呢部手機／瀏覽器入面，唔會上傳。</p>
</div>
<script>
"use strict";
var W = 420, H = 640;
var BEST_KEY = "shooter-best";
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function rand(a, b) { return a + Math.random() * (b - a); }
function circleHit(a, b) {
  var dx = a.x - b.x, dy = a.y - b.y, r = a.r + b.r;
  return dx * dx + dy * dy < r * r;
}
if (typeof module !== "undefined" && module.exports) {
  module.exports = { clamp: clamp, rand: rand, circleHit: circleHit, W: W, H: H };
}

if (typeof document !== "undefined" && document.getElementById("game")) {
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");
  var livesEl = document.getElementById("lives");
  var overlayEl = document.getElementById("overlay");
  var overlayTitle = document.getElementById("overlay-title");
  var overlaySub = document.getElementById("overlay-sub");
  var overlayButtons = document.getElementById("overlay-buttons");
  var dpr = 1;
  try { dpr = Math.min(2, window.devicePixelRatio || 1); } catch (e) { dpr = 1; }
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, "#101736"); bgGrad.addColorStop(1, "#050818");

  var state, stars, keys, pointer, rafId, lastTime;
  var best = 0;
  try { best = parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch (e) { best = 0; }

  function initStars() {
    stars = [];
    for (var i = 0; i < 70; i++) {
      stars.push({ x: Math.random() * W, y: Math.random() * H, s: rand(0.6, 2.2), v: rand(18, 70) });
    }
  }
  function resetGame() {
    state = {
      running: false, paused: false, over: false,
      score: 0, elapsed: 0, spawnTimer: 0.4, bossTimer: 45, bossAlive: false,
      fireTimer: 0, shake: 0,
      player: { x: W / 2, y: H - 90, r: 20, lives: 3, invulnUntil: 0, shield: false, weapon: 1, weaponUntil: 0 },
      bullets: [], enemies: [], powerups: [], particles: [], texts: []
    };
  }
  function saveBest() {
    try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
  }
  function updateHud() {
    scoreEl.textContent = String(state.score);
    bestEl.textContent = String(best);
    var hearts = "";
    for (var i = 0; i < 3; i++) hearts += i < state.player.lives ? "❤️" : "🖤";
    livesEl.textContent = hearts;
  }
  function hideOverlay() { overlayEl.classList.remove("show"); }
  function showOverlay(title, sub, buttons) {
    overlayTitle.textContent = title;
    overlaySub.textContent = sub;
    overlayButtons.innerHTML = "";
    buttons.forEach(function (b) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = b.label;
      btn.addEventListener("click", b.onClick);
      overlayButtons.appendChild(btn);
    });
    overlayEl.classList.add("show");
  }
  function explode(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = rand(40, 190);
      state.particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.3, 0.6), max: 0.6, r: rand(2, 5), color: color });
    }
  }
  function addScore(n, x, y) {
    state.score += n;
    if (state.score > best) { best = state.score; saveBest(); }
    state.texts.push({ x: x, y: y, text: "+" + n, life: 0.8 });
  }
  function spawnEnemy(forceType) {
    var t = forceType, roll = Math.random();
    if (!t) {
      if (state.elapsed > 20 && roll < 0.14) t = "large";
      else if (state.elapsed > 8 && roll < 0.45) t = "medium";
      else t = "small";
    }
    var e;
    if (t === "small") e = { type: "small", x: rand(24, W - 24), y: -24, r: 16, hp: 1, maxHp: 1, vy: rand(95, 140), score: 10, emoji: "🛸", wob: 0 };
    else if (t === "medium") e = { type: "medium", x: rand(30, W - 30), y: -30, r: 22, hp: 3, maxHp: 3, vy: rand(60, 85), score: 30, emoji: "👾", wob: rand(0, 6.28) };
    else e = { type: "large", x: rand(40, W - 40), y: -40, r: 30, hp: 8, maxHp: 8, vy: rand(38, 52), score: 80, emoji: "👽", wob: 0 };
    state.enemies.push(e);
    return e;
  }
  function spawnBoss() {
    var boss = { type: "boss", x: W / 2, y: -50, r: 38, hp: 40, maxHp: 40, vy: 34, score: 500, emoji: "🤖", wob: 0, phase: "enter" };
    state.enemies.push(boss);
    state.bossAlive = true;
    return boss;
  }
  function dropPowerup(x, y, kind) {
    var kinds = ["star", "shield", "heart"];
    var k = kind || kinds[Math.floor(Math.random() * kinds.length)];
    var emoji = k === "star" ? "⭐" : (k === "shield" ? "🛡️" : "❤️");
    state.powerups.push({ x: x, y: y, r: 15, vy: 55, kind: k, emoji: emoji });
  }
  function fireBullets() {
    var p = state.player, lvl = p.weapon, i;
    var offsets = lvl === 1 ? [[0, 0]] : (lvl === 2 ? [[-11, 0], [11, 0]] : [[-13, -70], [0, 0], [13, 70]]);
    for (i = 0; i < offsets.length; i++) {
      state.bullets.push({ x: p.x + offsets[i][0], y: p.y - 22, vx: offsets[i][1], vy: -640, r: 4, dmg: 1 });
    }
  }
  function damagePlayer() {
    var p = state.player, now = state.elapsed;
    if (now < p.invulnUntil) return;
    if (p.shield) {
      p.shield = false;
      p.invulnUntil = now + 1;
      explode(p.x, p.y, "#4dd0e1", 14);
      return;
    }
    p.lives -= 1;
    p.invulnUntil = now + 2;
    state.shake = 0.35;
    explode(p.x, p.y, "#ff7043", 22);
    if (p.lives <= 0) {
      state.over = true;
      state.running = false;
      updateHud();
      showOverlay("任務結束！", "分數 " + state.score + " 分\n最高分 " + best + " 分", [
        { label: "再玩一次", onClick: startGame }
      ]);
    }
  }
  function update(dt) {
    var i, j, p = state.player;
    state.elapsed += dt;
    state.shake = Math.max(0, state.shake - dt);
    // player movement: pointer target eases, keyboard velocity
    if (pointer.active) {
      p.x += (pointer.x - p.x) * Math.min(1, dt * 14);
      p.y += (pointer.y - p.y) * Math.min(1, dt * 14);
    }
    var sp = 330 * dt;
    if (keys.left) p.x -= sp;
    if (keys.right) p.x += sp;
    if (keys.up) p.y -= sp;
    if (keys.down) p.y += sp;
    p.x = clamp(p.x, 24, W - 24);
    p.y = clamp(p.y, 70, H - 36);
    if (p.weapon > 1 && state.elapsed > p.weaponUntil) p.weapon = 1;
    // firing
    state.fireTimer -= dt;
    if (state.fireTimer <= 0) { fireBullets(); state.fireTimer = 0.15; }
    // spawning
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0) {
      spawnEnemy();
      var base = Math.max(0.34, 0.85 - state.elapsed * 0.006);
      state.spawnTimer = state.bossAlive ? base * 2.4 : base;
    }
    state.bossTimer -= dt;
    if (state.bossTimer <= 0) {
      spawnBoss();
      state.bossTimer = 45;
    }
    // bullets
    for (i = state.bullets.length - 1; i >= 0; i--) {
      var b = state.bullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.y < -20 || b.x < -20 || b.x > W + 20) state.bullets.splice(i, 1);
    }
    // enemies
    for (i = state.enemies.length - 1; i >= 0; i--) {
      var e = state.enemies[i];
      if (e.type === "boss") {
        if (e.phase === "enter") {
          e.y += e.vy * dt;
          if (e.y >= 96) { e.y = 96; e.phase = "hover"; }
        } else {
          e.wob += dt * 1.4;
          e.x = W / 2 + Math.sin(e.wob) * 130;
        }
      } else {
        e.y += e.vy * dt;
        if (e.type === "medium") { e.wob += dt * 2.2; e.x += Math.sin(e.wob) * 26 * dt; }
      }
      if (e.y > H + 60) state.enemies.splice(i, 1);
    }
    // bullet vs enemy
    for (i = state.bullets.length - 1; i >= 0; i--) {
      var hit = false;
      for (j = state.enemies.length - 1; j >= 0; j--) {
        if (circleHit(state.bullets[i], state.enemies[j])) {
          var en = state.enemies[j];
          en.hp -= state.bullets[i].dmg;
          state.bullets.splice(i, 1);
          hit = true;
          if (en.hp <= 0) {
            explode(en.x, en.y, en.type === "boss" ? "#ffd54f" : "#ef5350", en.type === "boss" ? 34 : 14);
            addScore(en.score, en.x, en.y);
            if (en.type === "boss") {
              state.bossAlive = false;
              dropPowerup(en.x - 24, en.y, "shield");
              dropPowerup(en.x + 24, en.y, "star");
            } else if (en.type === "large") {
              if (Math.random() < 0.35) dropPowerup(en.x, en.y);
            } else if (en.type === "medium") {
              if (Math.random() < 0.12) dropPowerup(en.x, en.y);
            } else {
              if (Math.random() < 0.05) dropPowerup(en.x, en.y, "star");
            }
            state.enemies.splice(j, 1);
          }
          break;
        }
      }
      if (hit) continue;
    }
    // enemy vs player
    for (i = state.enemies.length - 1; i >= 0; i--) {
      if (circleHit(state.enemies[i], p)) {
        var dead = state.enemies[i];
        explode(dead.x, dead.y, "#ef5350", 14);
        state.enemies.splice(i, 1);
        damagePlayer();
        if (state.over) break;
      }
    }
    // powerups
    for (i = state.powerups.length - 1; i >= 0; i--) {
      var pu = state.powerups[i];
      pu.y += pu.vy * dt;
      if (circleHit(pu, p)) {
        if (pu.kind === "star") { p.weapon = Math.min(3, p.weapon + 1); p.weaponUntil = state.elapsed + 12; state.texts.push({ x: p.x, y: p.y - 34, text: "火力升級！", life: 0.9 }); }
        else if (pu.kind === "shield") { p.shield = true; state.texts.push({ x: p.x, y: p.y - 34, text: "護盾！", life: 0.9 }); }
        else if (pu.kind === "heart" && p.lives < 3) { p.lives += 1; state.texts.push({ x: p.x, y: p.y - 34, text: "+1 命！", life: 0.9 }); }
        state.powerups.splice(i, 1);
        continue;
      }
      if (pu.y > H + 30) state.powerups.splice(i, 1);
    }
    // particles + floating texts
    for (i = state.particles.length - 1; i >= 0; i--) {
      var pt = state.particles[i];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.life -= dt;
      if (pt.life <= 0) state.particles.splice(i, 1);
    }
    for (i = state.texts.length - 1; i >= 0; i--) {
      state.texts[i].y -= 34 * dt; state.texts[i].life -= dt;
      if (state.texts[i].life <= 0) state.texts.splice(i, 1);
    }
    updateHud();
  }
  function render() {
    var i, p = state.player;
    ctx.save();
    if (state.shake > 0) ctx.translate(rand(-4, 4) * state.shake * 3, rand(-4, 4) * state.shake * 3);
    ctx.fillStyle = bgGrad;
    ctx.fillRect(-10, -10, W + 20, H + 20);
    ctx.fillStyle = "#ffffff";
    for (i = 0; i < stars.length; i++) {
      var st = stars[i];
      ctx.globalAlpha = 0.4 + st.s * 0.25;
      ctx.fillRect(st.x, st.y, st.s, st.s);
    }
    ctx.globalAlpha = 1;
    // powerups
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (i = 0; i < state.powerups.length; i++) {
      var pu = state.powerups[i];
      ctx.font = "28px sans-serif";
      ctx.fillText(pu.emoji, pu.x, pu.y);
    }
    // enemies
    for (i = 0; i < state.enemies.length; i++) {
      var e = state.enemies[i];
      ctx.font = (e.r * 2) + "px sans-serif";
      ctx.fillText(e.emoji, e.x, e.y);
      if (e.maxHp > 1) {
        var bw = e.r * 2, bx = e.x - bw / 2, by = e.y - e.r - 10;
        ctx.fillStyle = "#37474f";
        ctx.fillRect(bx, by, bw, 5);
        ctx.fillStyle = "#ef5350";
        ctx.fillRect(bx, by, bw * Math.max(0, e.hp / e.maxHp), 5);
      }
    }
    // bullets
    ctx.fillStyle = "#ffee58";
    for (i = 0; i < state.bullets.length; i++) {
      var b = state.bullets[i];
      ctx.fillRect(b.x - 2.5, b.y - 9, 5, 18);
    }
    // player (blink while invulnerable)
    var blink = state.elapsed < p.invulnUntil && Math.floor(state.elapsed * 12) % 2 === 0;
    if (!blink) {
      ctx.font = "44px sans-serif";
      ctx.fillText("🚀", p.x, p.y);
    }
    if (p.shield) {
      ctx.strokeStyle = "#4dd0e1"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 8, 0, Math.PI * 2); ctx.stroke();
    }
    // particles
    for (i = 0; i < state.particles.length; i++) {
      var pt = state.particles[i];
      ctx.globalAlpha = Math.max(0, pt.life / pt.max);
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // floating texts
    ctx.font = "bold 16px sans-serif"; ctx.fillStyle = "#ffee58";
    for (i = 0; i < state.texts.length; i++) {
      var tx = state.texts[i];
      ctx.globalAlpha = Math.min(1, tx.life);
      ctx.fillText(tx.text, tx.x, tx.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
  function loop(t) {
    rafId = requestAnimationFrame(loop);
    if (!lastTime) lastTime = t;
    var dt = Math.min(0.05, (t - lastTime) / 1000);
    lastTime = t;
    for (var i = 0; i < stars.length; i++) {
      stars[i].y += stars[i].v * dt;
      if (stars[i].y > H) { stars[i].y = -4; stars[i].x = Math.random() * W; }
    }
    if (state.running && !state.paused && !state.over) update(dt);
    render();
  }
  function startGame() {
    resetGame();
    hideOverlay();
    state.running = true;
    state.paused = false;
    updateHud();
    document.getElementById("pause-btn").textContent = "暫停";
  }
  keys = { left: false, right: false, up: false, down: false };
  pointer = { active: false, x: W / 2, y: H - 90 };
  function canvasPoint(e) {
    var rect = canvas.getBoundingClientRect();
    var cx = (e.clientX - rect.left) * (W / rect.width);
    var cy = (e.clientY - rect.top) * (H / rect.height);
    return { x: cx, y: cy - 62 };
  }
  canvas.addEventListener("pointerdown", function (e) {
    var pt = canvasPoint(e);
    pointer.active = true; pointer.x = pt.x; pointer.y = pt.y;
    try { if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener("pointermove", function (e) {
    if (!pointer.active) return;
    var pt = canvasPoint(e);
    pointer.x = pt.x; pointer.y = pt.y;
  });
  function endPointer() { pointer.active = false; }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
    else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = true;
    else if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") keys.up = true;
    else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") keys.down = true;
  });
  document.addEventListener("keyup", function (e) {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
    else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
    else if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") keys.up = false;
    else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") keys.down = false;
  });
  document.getElementById("pause-btn").addEventListener("click", function () {
    if (!state.running || state.over) return;
    state.paused = !state.paused;
    this.textContent = state.paused ? "繼續" : "暫停";
    if (state.paused) showOverlay("已暫停", "撳「繼續」返去打。", [{ label: "繼續", onClick: function () { state.paused = false; document.getElementById("pause-btn").textContent = "暫停"; hideOverlay(); } }]);
    else hideOverlay();
  });
  document.getElementById("restart-btn").addEventListener("click", startGame);

  try { window.__shooter = { getState: function () { return state; }, start: startGame }; } catch (err) {}
  initStars();
  resetGame();
  updateHud();
  showOverlay("太空戰機", "手指按住戰機拖動，子彈自動發射。\n打爆敵機攞分，拎 ⭐ 🛡️ ❤️ 幫手，\n頂住 45 秒就會有大佬！", [
    { label: "開始遊戲", onClick: startGame }
  ]);
  lastTime = 0;
  rafId = requestAnimationFrame(loop);
}
</script>
</body>
</html>
